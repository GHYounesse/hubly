framework:
    notifier:
        chatter_transports:
            # Falls back to the null transport when SLACK_DSN is not set (see slack_dsn_default in services.yaml)
            slack: '%env(string:default:slack_dsn_default:SLACK_DSN)%'
        texter_transports:
        channel_policy:
            # use chat/slack, chat/telegram, sms/twilio or sms/nexmo
            urgent: ['email']
            high: ['email']
            medium: ['email']
            low: ['email']
        admin_recipients:
            - { email: admin@example.com }
