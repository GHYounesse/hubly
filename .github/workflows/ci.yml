name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: PHP ${{ matrix.php }} - lint & tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: hubly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app -d hubly_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: test
      APP_SECRET: ci-only-secret
      APP_ENCRYPTION_KEY: Y2ktb25seS1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcyE=
      # Doctrine appends "_test" in the test environment, so this targets the hubly_test database of the service above
      DATABASE_URL: postgresql://app:app@127.0.0.1:5432/hubly?serverVersion=16&charset=utf8
      MAILER_DSN: null://null
      MAIL_FROM: ci@example.com
      ALERT_RECIPIENT: ci@example.com
      JWT_SECRET_KEY: ${{ github.workspace }}/config/jwt/private.pem
      JWT_PUBLIC_KEY: ${{ github.workspace }}/config/jwt/public.pem
      JWT_PASSPHRASE: ci-only

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, iconv, intl, pdo_pgsql
          coverage: pcov
          tools: composer:v2

      - name: Create .env from the example
        run: cp .env.example .env

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('**/composer.lock', '**/composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Validate composer.json
        run: composer validate --no-check-lock

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Generate JWT keys
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists

      - name: Lint PHP files
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Lint YAML configuration
        run: php bin/console lint:yaml config --parse-tags

      - name: Lint Twig templates
        run: php bin/console lint:twig templates

      - name: Lint service container
        run: php bin/console lint:container

      - name: Run Doctrine migrations
        run: php bin/console doctrine:migrations:migrate --no-interaction

      - name: Validate Doctrine mapping and schema
        run: php bin/console doctrine:schema:validate

      - name: Run tests
        run: |
          if find tests -name '*Test.php' | grep -q .; then
            vendor/bin/phpunit --coverage-text --colors=never
          else
            echo "No tests found, skipping."
          fi

  frontend:
    name: Tailwind build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build
